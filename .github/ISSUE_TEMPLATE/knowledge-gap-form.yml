name: Validate Markdown Standards
on:
  pull_request:
    branches: [ main ]

jobs:
  markdown-lint:
    name: Lint Knowledge OS Files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Base
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-node: '20'

      - name: Install Markdown Linter
        run: npm install -g markdownlint-cli

      - name: Execute Linter Checks
        run: |
          # Scans all custom skills files to ensure clear headers and scannability
          markdownlint '.github/skills/**/*.md' --disable MD013
