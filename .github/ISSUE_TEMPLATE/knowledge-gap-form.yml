name: "Reporting a Qlik Knowledge Gap"
description: Log an active technical unknown or data transformation hurdle.
labels: ["knowledge-gap"]
body:
  - type: input
    id: title
    attributes:
      label: Gap Title
      placeholder: e.g., Timezone conversion discrepancy in ERP
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority Level
      options:
        - "🔴 High"
        - "🟡 Medium"
        - "🟢 Low"
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context & Technical Impact
      placeholder: Describe what is happening and why it impacts the Qlik data model.
    validations:
      required: true
  - type: textarea
    id: questions
    attributes:
      label: Open Questions / Action Required
      placeholder: What architectural questions need answering?
    validations:
      required: true
